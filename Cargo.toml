[workspace]
resolver = "2"
members = [
    "crates/primitives",
    "crates/crypto",
    "crates/core",
    "crates/storage",
    "crates/consensus",
    "crates/genesis",
    "crates/evm",
    "crates/mempool",
    "crates/rpc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/LucienSong/shell-chain"

[workspace.dependencies]
# --- primitives ---
alloy-primitives = { version = "1.5", features = ["serde", "rlp"] }
alloy-rlp = { version = "0.3", features = ["derive"] }
sha3 = "0.10"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"

# --- crypto ---
shell-primitives = { path = "crates/primitives" }
shell-crypto = { path = "crates/crypto" }
shell-core = { path = "crates/core" }
shell-storage = { path = "crates/storage" }
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"
zeroize = { version = "1", features = ["derive"] }

# --- consensus ---
async-trait = "0.1"

# --- storage (trie) ---
eth_trie = "0.4"

# --- evm ---
revm = { version = "36", default-features = false, features = ["std", "optional_no_base_fee"] }

# --- rpc ---
jsonrpsee = { version = "0.24", features = ["server", "macros"] }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"

# --- storage (rocksdb) ---
rocksdb = { version = "0.22", default-features = false, features = ["snappy"] }
