# Alpha testnet deployment: 3 validators + public RPC + nginx reverse proxy.
# Usage:
#   cp .env.example .env   # edit as needed
#   docker compose -f docker-compose.alpha.yml up -d

services:
  node1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shell-alpha-node1
    env_file: .env
    environment:
      - GENESIS_CREATOR=true
      - DATADIR=/data
      - SHARED=/shared
      - SHELL_NODE_ROLE=validator
    command: >
      --datadir /data
      --rpc-addr 0.0.0.0:8545
      --ws --ws-port 8546
      --p2p --p2p-addr 0.0.0.0:30303
      --enable-mdns
      --rpc-cors "${RPC_CORS:-*}"
      --rpc-api ${RPC_API:-eth,net,web3,shell}
      --db ${DB_BACKEND:-rocksdb}
      --block-time ${BLOCK_TIME:-2000}
      --chain-id ${CHAIN_ID:-1337}
      --keystore /data/keystore.json
      --metrics-addr 0.0.0.0:9090
      --log-format json
    volumes:
      - genesis:/shared
      - node1-data:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  node2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shell-alpha-node2
    depends_on:
      node1:
        condition: service_healthy
    env_file: .env
    environment:
      - DATADIR=/data
      - SHARED=/shared
      - SHELL_NODE_ROLE=validator
    command: >
      --datadir /data
      --rpc-addr 0.0.0.0:8545
      --ws --ws-port 8546
      --p2p --p2p-addr 0.0.0.0:30303
      --enable-mdns
      --rpc-cors "${RPC_CORS:-*}"
      --rpc-api ${RPC_API:-eth,net,web3,shell}
      --db ${DB_BACKEND:-rocksdb}
      --block-time ${BLOCK_TIME:-2000}
      --chain-id ${CHAIN_ID:-1337}
      --keystore /data/keystore.json
      --metrics-addr 0.0.0.0:9090
      --log-format json
    volumes:
      - genesis:/shared
      - node2-data:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  node3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shell-alpha-node3
    depends_on:
      node1:
        condition: service_healthy
    env_file: .env
    environment:
      - DATADIR=/data
      - SHARED=/shared
      - SHELL_NODE_ROLE=validator
    command: >
      --datadir /data
      --rpc-addr 0.0.0.0:8545
      --ws --ws-port 8546
      --p2p --p2p-addr 0.0.0.0:30303
      --enable-mdns
      --rpc-cors "${RPC_CORS:-*}"
      --rpc-api ${RPC_API:-eth,net,web3,shell}
      --db ${DB_BACKEND:-rocksdb}
      --block-time ${BLOCK_TIME:-2000}
      --chain-id ${CHAIN_ID:-1337}
      --keystore /data/keystore.json
      --metrics-addr 0.0.0.0:9090
      --log-format json
    volumes:
      - genesis:/shared
      - node3-data:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  rpc-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shell-alpha-rpc
    depends_on:
      node1:
        condition: service_healthy
    env_file: .env
    environment:
      - DATADIR=/data
      - SHARED=/shared
      - SHELL_NODE_ROLE=rpc
    command: >
      --datadir /data
      --rpc-addr 0.0.0.0:8545
      --ws --ws-port 8546
      --p2p --p2p-addr 0.0.0.0:30303
      --enable-mdns
      --rpc-cors "${RPC_CORS:-*}"
      --rpc-api ${RPC_API:-eth,net,web3,shell}
      --rpc-rate-limit ${RPC_RATE_LIMIT:-100}
      --db ${DB_BACKEND:-rocksdb}
      --chain-id ${CHAIN_ID:-1337}
      --metrics-addr 0.0.0.0:9090
      --log-format json
    volumes:
      - genesis:/shared
      - rpc-data:/data
    networks:
      - internal
      - frontend
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: shell-alpha-nginx
    depends_on:
      rpc-node:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-443}:443"
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  genesis:
  node1-data:
  node2-data:
  node3-data:
  rpc-data:

networks:
  internal:
    driver: bridge
    internal: true
  frontend:
    driver: bridge
